name: Fix Szymbark photo credit

on:
  push:
    branches:
      - feature/crazycopter-photo-refresh

permissions:
  contents: write

jobs:
  fix-credit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/crazycopter-photo-refresh
          fetch-depth: 0

      - name: Remove obsolete Wikimedia credit
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('script.js')
          text = path.read_text(encoding='utf-8')
          updated, count = re.subn(
              r"^\s*addTripCredit\('pol-dnia', 'Zdjęcie: ruiny zamku w Szymbarku.*?\);\s*$\n?",
              '',
              text,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit(f'Expected to remove exactly one obsolete Szymbark credit, removed {count}')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          rm .github/workflows/fix-szymbark-credit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js .github/workflows/fix-szymbark-credit.yml
          git commit -m "Fix Szymbark CrazyCopter credit"
          git push origin HEAD:feature/crazycopter-photo-refresh
