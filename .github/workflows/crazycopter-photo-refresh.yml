name: CrazyCopter photo refresh

on:
  push:
    branches:
      - feature/crazycopter-photo-refresh
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/crazycopter-photo-refresh
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check Pillow requests beautifulsoup4

      - name: Download, optimize and wire photos into pages
        run: python tools/update_crazycopter_assets.py

      - name: Commit generated site changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add licensed CrazyCopter photos and refresh regional pages"
          git push origin HEAD:feature/crazycopter-photo-refresh
