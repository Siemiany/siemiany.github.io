name: Navigation cleanup

on:
  push:
    branches:
      - navigation-cleanup
    paths:
      - .github/workflows/navigation-cleanup.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: navigation-cleanup
      - name: Simplify global navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          new_menu = base64.b64decode("").decode("utf-8")
          pattern = re.compile(r'<div class="navlinks mega-nav">.*?</div></div></nav>', re.S)
          changed = []

          for path in Path(".").glob("*.html"):
              text = path.read_text(encoding="utf-8")
              if '<div class="navlinks mega-nav">' not in text:
                  continue
              updated, count = pattern.subn(new_menu + '</div></nav>', text, count=1)
              if count != 1:
                  raise SystemExit(f"Could not replace navigation in {path}")
              updated = updated.replace('<aside class="article-nav">', '<aside aria-label="Na tej stronie" class="article-nav">')
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(path.name)

          if len(changed) < 10:
              raise SystemExit(f"Unexpected number of updated HTML files: {len(changed)}")

          css = Path("styles.css")
          css_text = css.read_text(encoding="utf-8")
          marker = "/* Navigation clarity: global menu = pages, article nav = sections */"
          if marker not in css_text:
              css_text += '\n\n' + marker + '\n.article-nav::before{content:"Na tej stronie";display:block;font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--lake);font-weight:800;margin:0 0 9px}\n@media(max-width:900px){.article-nav::before{flex-basis:100%;width:100%;margin:0 0 2px}}\n'
              css.write_text(css_text, encoding="utf-8")

          print("Updated:", ", ".join(changed))
          PY
      - name: Validate navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = []
          for path in Path(".").glob("*.html"):
              text = path.read_text(encoding="utf-8")
              if '<div class="navlinks mega-nav">' not in text:
                  continue
              files.append(path.name)
              match = re.search(r'<div class="navlinks mega-nav">(.*?)</div></div></nav>', text, re.S)
              if not match:
                  raise SystemExit(f"Navigation block missing in {path}")
              if re.search(r'href="[^"]*#', match.group(1)):
                  raise SystemExit(f"Anchor link remains in global navigation: {path}")

          if not files:
              raise SystemExit("No navigation files found")
          print("Validated", len(files), "HTML files")
          PY
      - name: Commit navigation cleanup
        shell: bash
        run: |
          rm .github/workflows/navigation-cleanup.yml
          git config user.name "Siemiany"
          git config user.email "50377048+Siemiany@users.noreply.github.com"
          git add '*.html' styles.css .github/workflows/navigation-cleanup.yml
          git commit -m "Simplify site navigation"
          git push origin HEAD:navigation-cleanup
