name: One-time refine Ilawa cached image

on:
  push:
    branches:
      - fix/szymbark-ilawa-images
    paths:
      - .github/workflows/refine-ilawa-cache.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/szymbark-ilawa-images
      - name: Fetch high-resolution cached rendition in original aspect
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          curl -fL --retry 2 -A 'Mozilla/5.0' \
            'https://th.bing.com/th/id/OIP.3_KhVzEDSVqyeK-XEWhzMAHaHa?w=1600&h=1069&c=7&rs=1&pid=ImgDetMain' \
            -o /tmp/ilawa.jpg
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('/tmp/ilawa.jpg')
          with Image.open(p) as im:
              im.load()
              print('downloaded dimensions:', im.size, im.format)
              assert im.width >= 1200 and 1.45 < im.width/im.height < 1.55
              im.convert('RGB').save('assets/img/ilawa-maly-jeziorak-um.jpg','JPEG',quality=94)
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'siemiany-site-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/refine-ilawa-cache.yml
          git add assets/img/ilawa-maly-jeziorak-um.jpg
          git commit -m 'Preserve original aspect ratio for Iława photo'
          git push origin HEAD:fix/szymbark-ilawa-images
