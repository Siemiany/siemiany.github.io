name: Finalize new photos

on:
  push:
    branches: [new-photos]
    paths:
      - .github/workflows/finalize-new-photos.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-photos
          fetch-depth: 0
      - name: Final wording check
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('jerzwald.html')
          text = path.read_text(encoding='utf-8')
          old = 'Zdjęcie powyżej jest własne.'
          new = 'Zdjęcie fortepianu jest własne.'
          if old not in text:
              raise SystemExit('Expected wording not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit final wording
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jerzwald.html
          git commit -m "Doprecyzuj podpis własnego zdjęcia fortepianu"
          git push origin HEAD:new-photos
