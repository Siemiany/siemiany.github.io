name: Process new photos

on:
  push:
    branches: [new-photos]
    paths:
      - .github/workflows/process-new-photos.yml

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-photos
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet pillow beautifulsoup4
      - name: Optimize and integrate photos
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          from bs4 import BeautifulSoup
          import re

          ROOT = Path('.')
          IMG = ROOT / 'assets' / 'img'
          R = IMG / 'r'
          IMG.mkdir(parents=True, exist_ok=True)
          R.mkdir(parents=True, exist_ok=True)

          mapping = {
              'fortepian.png': 'fortepian-jerzwald',
              'jerzwald-fortepian-kukly.png': 'jerzwald-fortepian-kukly',
              'jerzwald-kanal.png': 'jerzwald-kanal',
              'jerzwald-kukly-fortepian.png': 'jerzwald-kukly-fortepian',
              'jerzwald-kulka.png': 'jerzwald-kulka',
              'siemiany-domek-lazienka.png': 'domek-lazienka',
              'siemiany-nowa-zabudowa-plaza.png': 'siemiany-nowa-infrastruktura-plaza',
              'siemiany-stacja-ladowania-bateri.png': 'siemiany-stacja-ladowania-rowerow',
              'susz-plac-zabaw.png': 'susz-plac-zabaw',
              'susz-plaza-2.png': 'susz-plaza-2',
              'susz-plaza-hustawka.png': 'susz-plaza-hustawka',
              'susz-plaza.png': 'susz-plaza',
          }

          meta = {}
          for source_name, base in mapping.items():
              source = ROOT / source_name
              if not source.exists():
                  raise FileNotFoundError(source)
              with Image.open(source) as original:
                  image = ImageOps.exif_transpose(original).convert('RGB')
                  ow, oh = image.size
                  full_w = min(1448, ow)
                  full_h = round(oh * full_w / ow)
                  full = image.resize((full_w, full_h), Image.Resampling.LANCZOS) if full_w != ow else image.copy()
                  full.save(IMG / f'{base}.webp', 'WEBP', quality=82, method=6)
                  variants = []
                  for width in (480, 800, 1200):
                      if width >= full_w:
                          continue
                      height = round(full_h * width / full_w)
                      resized = full.resize((width, height), Image.Resampling.LANCZOS)
                      resized.save(R / f'{base}-{width}.webp', 'WEBP', quality=80, method=6)
                      variants.append((width, height))
                  meta[base] = {'width': full_w, 'height': full_h, 'variants': variants}
              source.unlink()

          def srcset(base):
              m = meta[base]
              parts = [f'assets/img/r/{base}-{w}.webp {w}w' for w, _ in m['variants']]
              parts.append(f"assets/img/{base}.webp {m['width']}w")
              return ', '.join(parts)

          def figure(base, alt, caption, sizes='(max-width: 760px) 100vw, 70vw', cls='place-photo'):
              m = meta[base]
              return (f'<figure class="{cls}"><img alt="{alt}" decoding="async" height="{m["height"]}" loading="lazy" '
                      f'sizes="{sizes}" src="assets/img/{base}.webp" srcset="{srcset(base)}" width="{m["width"]}"/>'
                      f'<figcaption>{caption}</figcaption></figure>')

          def gallery_link(base, alt, css_class):
              m = meta[base]
              return (f'<a class="{css_class}" data-lightbox="" href="assets/img/{base}.webp">'
                      f'<img alt="{alt}" decoding="async" height="{m["height"]}" loading="lazy" '
                      f'sizes="(max-width: 760px) 100vw, 33vw" src="assets/img/{base}.webp" srcset="{srcset(base)}" width="{m["width"]}"/></a>')

          def edit_section(path, section_id, editor):
              text = Path(path).read_text(encoding='utf-8')
              pattern = re.compile(rf'(<section id="{re.escape(section_id)}"[^>]*>)(.*?)(</section>)', re.S)
              match = pattern.search(text)
              if not match:
                  raise RuntimeError(f'Section {section_id} not found in {path}')
              body = editor(match.group(2))
              text = text[:match.start()] + match.group(1) + body + match.group(3) + text[match.end():]
              Path(path).write_text(text, encoding='utf-8')

          # Jerzwałd: kanał.
          kanal_figure = figure(
              'jerzwald-kanal',
              'Kanał Jerzwałdzki w lesie koło Jerzwałdu',
              'Kanał Jerzwałdzki / Zdryński - zdjęcie własne.'
          )
          def kanal_editor(body):
              body = re.sub(r'<figure[^>]*>.*?jerzwald-kanal.*?</figure>', '', body, flags=re.S)
              marker = '<a class="more"'
              pos = body.find(marker)
              return body[:pos] + kanal_figure + body[pos:] if pos >= 0 else body + kanal_figure
          edit_section('jerzwald.html', 'kanal', kanal_editor)

          # Jerzwałd: własne zdjęcie fortepianu oraz osobna instalacja z kukłami.
          piano_figure = figure(
              'fortepian-jerzwald',
              'Fortepian na łące w Jerzwałdzie',
              'Fortepian na łące w Jerzwałdzie - zdjęcie własne.'
          )
          installation = (
              '<h3>Fortepiany i kukły - inne miejsce w Jerzwałdzie</h3>'
              '<p>To osobna, plenerowa instalacja w Jerzwałdzie, niezwiązana z fortepianem wykorzystywanym podczas „Raz w Roku w Jerzwałdzie”. '
              'Zostawiamy ją jako ciekawy, trochę surrealistyczny detal miejscowości.</p>'
              '<div class="gallery">'
              + gallery_link('jerzwald-fortepian-kukly', 'Fortepian i kukły w plenerowej instalacji w Jerzwałdzie', 'gallery-narrow')
              + gallery_link('jerzwald-kukly-fortepian', 'Kukły i fortepian w Jerzwałdzie', 'gallery-narrow')
              + gallery_link('jerzwald-kulka', 'Detal plenerowej instalacji w Jerzwałdzie', 'gallery-narrow')
              + '</div>'
          )
          def kultura_editor(body):
              body = re.sub(r'<figure[^>]*>.*?fortepian-jerzwald.*?</figure>', '', body, flags=re.S)
              body = re.sub(r'<h3>Fortepiany i kukły.*?</div>', '', body, flags=re.S)
              return body + piano_figure + installation
          edit_section('jerzwald.html', 'kultura', kultura_editor)

          # Siemiany: nowa infrastruktura plażowa.
          beach_figure = figure(
              'siemiany-nowa-infrastruktura-plaza',
              'Nowa infrastruktura przy plaży w Siemianach',
              'Nowa infrastruktura przy plaży w Siemianach - zdjęcie własne.'
          )
          def beaches_editor(body):
              body = re.sub(r'<figure[^>]*>.*?siemiany-nowa-infrastruktura-plaza.*?</figure>', '', body, flags=re.S)
              marker = '<p class="notice">'
              pos = body.find(marker)
              return body[:pos] + beach_figure + body[pos:] if pos >= 0 else body + beach_figure
          edit_section('siemiany.html', 'plaze', beaches_editor)

          # Siemiany: punkt rowerowy i ładowanie.
          charging_figure = figure(
              'siemiany-stacja-ladowania-rowerow',
              'Stacja ładowania i infrastruktura dla rowerzystów w Siemianach',
              'Nowy punkt dla rowerzystów w Siemianach - zdjęcie własne.'
          )
          def cycling_editor(body):
              body = re.sub(r'<figure[^>]*>.*?siemiany-stacja-ladowania-rowerow.*?</figure>', '', body, flags=re.S)
              return body + charging_figure
          edit_section('siemiany.html', 'rowerzysta', cycling_editor)

          # Susz: dwa dodatkowe kadry plaży. Główne zdjęcie i plac zabaw są podmieniane przez script.js.
          susz_gallery = (
              '<div class="gallery" data-susz-new-gallery="">'
              + gallery_link('susz-plaza-2', 'Plaża miejska nad Jeziorem Suskim', 'gallery-half')
              + gallery_link('susz-plaza-hustawka', 'Huśtawka i strefa wypoczynku przy plaży w Suszu', 'gallery-half')
              + '</div>'
          )
          def susz_editor(body):
              body = re.sub(r'<div class="gallery" data-susz-new-gallery="">.*?</div>', '', body, flags=re.S)
              first_figure = re.search(r'</figure>', body)
              if not first_figure:
                  return body + susz_gallery
              p = first_figure.end()
              return body[:p] + susz_gallery + body[p:]
          edit_section('susz.html', 'susz', susz_editor)

          # Domek: podmieniamy istniejące zdjęcie łazienki bez zmiany adresu pliku.
          domek = Path('domek.html').read_text(encoding='utf-8')
          m = meta['domek-lazienka']
          new_bath = (f'<img alt="Jasna łazienka po remoncie z kompaktową kabiną prysznicową" decoding="async" '
                      f'height="{m["height"]}" loading="lazy" sizes="(max-width: 760px) 100vw, 50vw" '
                      f'src="assets/img/domek-lazienka.webp" srcset="{srcset("domek-lazienka")}" width="{m["width"]}"/>')
          domek, count = re.subn(r'<img[^>]*src="assets/img/domek-lazienka\.webp"[^>]*/>', new_bath, domek, count=1)
          if count != 1:
              raise RuntimeError('Bathroom image tag not found')
          Path('domek.html').write_text(domek, encoding='utf-8')

          # script.js: Susz używa nowych zdjęć i poprawnych metadanych responsywnych.
          script_path = Path('script.js')
          script = script_path.read_text(encoding='utf-8')
          script = script.replace("const suszBeachSrc = 'assets/img/susz-plaza-miejska.webp';", "const suszBeachSrc = 'assets/img/susz-plaza.webp';")

          def js_entry(base):
              m = meta[base]
              return (f'  "assets/img/{base}.webp": {{\n'
                      f'    "width": {m["width"]},\n'
                      f'    "height": {m["height"]},\n'
                      f'    "srcset": "{srcset(base)}"\n'
                      f'  }}')

          # Replace the existing playground registry entry, because the asset itself is being replaced.
          script = re.sub(
              r'  "assets/img/susz-plac-zabaw\.webp": \{.*?\n  \},',
              js_entry('susz-plac-zabaw') + ',',
              script,
              count=1,
              flags=re.S,
          )
          entries = [
              'fortepian-jerzwald', 'jerzwald-fortepian-kukly', 'jerzwald-kanal',
              'jerzwald-kukly-fortepian', 'jerzwald-kulka',
              'siemiany-nowa-infrastruktura-plaza', 'siemiany-stacja-ladowania-rowerow',
              'susz-plaza', 'susz-plaza-2', 'susz-plaza-hustawka'
          ]
          insertion = ',\n'.join(js_entry(base) for base in entries) + ',\n'
          script = script.replace('const responsivePhotos = {\n', 'const responsivePhotos = {\n' + insertion, 1)
          script_path.write_text(script, encoding='utf-8')

          # Ensure the JS helper runs after all dynamic image substitutions.
          if 'applyResponsivePhotos();' not in script:
              with script_path.open('a', encoding='utf-8') as f:
                  f.write('\napplyResponsivePhotos();\n')

          # Basic sanity checks.
          for path in ('jerzwald.html', 'siemiany.html', 'susz.html', 'domek.html', 'script.js'):
              text = Path(path).read_text(encoding='utf-8')
              if '.png' in text and any(name in text for name in mapping):
                  raise RuntimeError(f'Raw new PNG referenced in {path}')

          print('Processed photos:')
          for base, m in meta.items():
              print(f"- {base}: {m['width']}x{m['height']} -> {srcset(base)}")
          PY
      - name: Commit processed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Zoptymalizuj i dodaj nowe zdjęcia Jerzwałdu, Siemian i Susza"
          git push origin HEAD:new-photos
