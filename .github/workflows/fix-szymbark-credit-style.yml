name: Fix Szymbark credit style

on:
  push:
    branches:
      - fix/szymbark-crazycopter-credit

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/szymbark-crazycopter-credit
          fetch-depth: 0
      - name: Match Szymbark credit to other trip cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text()
          marker = "    addTripCredit('ilawa', 'Zdjęcie: Mały Jeziorak w Iławie — źródło: <a href=\"https://miastoilawa.pl/\" rel=\"noopener\" target=\"_blank\">Urząd Miasta Iławy ↗</a>.');\n"
          addition = marker + "    const szymbarkInlineCredit = document.querySelector('.trip#pol-dnia .source-note');\n    if (szymbarkInlineCredit?.textContent.includes('CrazyCopter')) szymbarkInlineCredit.remove();\n    addTripCredit('pol-dnia', 'Zdjęcie: ruiny zamku w Szymbarku — fot. <a href=\"https://www.crazycopter.pl/\" rel=\"noopener\" target=\"_blank\">Andrzej Budnik / CrazyCopter ↗</a>, wykorzystano za zgodą autora.');\n"
          if "addTripCredit('pol-dnia'" not in s:
              if marker not in s:
                  raise SystemExit('Insertion marker not found')
              s = s.replace(marker, addition, 1)
          p.write_text(s)
          PY
          rm .github/workflows/fix-szymbark-credit-style.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js .github/workflows/fix-szymbark-credit-style.yml
          git commit -m "Match Szymbark photo credit styling"
          git push origin HEAD:fix/szymbark-crazycopter-credit
