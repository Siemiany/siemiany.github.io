name: One-time mirror final images

on:
  push:
    branches:
      - fix/szymbark-ilawa-images
    paths:
      - .github/workflows/mirror-final-images.yml

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/szymbark-ilawa-images

      - name: Mirror requested images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/img
          curl -fL --retry 3 -A 'Mozilla/5.0' \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Schoenberg-Sammlung_Duncker_(5413840).jpg' \
            -o assets/img/szymbark-zamek-1869-duncker.jpg
          curl -fL --retry 3 -A 'Mozilla/5.0' \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Szymbark,_zamek,_pierzeja_wschodnia.jpg' \
            -o assets/img/szymbark-zamek-ruiny.jpg

          python -m pip install --quiet pillow
          python - <<'PY'
          import html, re, subprocess, urllib.parse
          from pathlib import Path
          from PIL import Image

          q = urllib.parse.quote('"Maly-Jeziorak-arch.-UM-Ilawa"')
          page = subprocess.check_output([
              'curl','-fL','--retry','2','-A','Mozilla/5.0',
              f'https://www.bing.com/images/search?q={q}&form=HDRSC3'
          ], text=True, errors='ignore')

          # Bing keeps thumbnails on its own servers even when the origin blocks hotlinks.
          raw = re.findall(r'https://th\.bing\.com/th/id/[^\"\'<> ]+', page)
          urls=[]
          for u in raw:
              u=html.unescape(u).replace('\\u0026','&')
              if u not in urls:
                  urls.append(u)
          print('Bing thumbnail candidates:', len(urls))
          for u in urls[:10]: print(u[:240])

          out=Path('assets/img/ilawa-maly-jeziorak-um.jpg')
          tmp=Path('/tmp/ilawa-cache')
          success=False
          for u in urls[:20]:
              variants=[u]
              base=u.split('?',1)[0]
              variants += [
                  base+'?w=1600&h=1200&c=7&rs=1&pid=ImgDetMain',
                  base+'?w=1200&h=900&c=7&rs=1&pid=ImgDetMain',
                  base,
              ]
              for v in variants:
                  tmp.unlink(missing_ok=True)
                  cp=subprocess.run(['curl','-fL','--retry','1','--max-time','30','-A','Mozilla/5.0','-o',str(tmp),v])
                  if cp.returncode: continue
                  try:
                      with Image.open(tmp) as im:
                          im.load(); w,h=im.size
                          print('candidate dimensions:',w,h,'from',v[:160])
                          if w < 450 or h < 280: continue
                          im.convert('RGB').save(out,'JPEG',quality=94)
                          success=True
                          break
                  except Exception as e:
                      print('not image:',e)
              if success: break
          if not success:
              raise SystemExit('No usable Bing cached copy found for the exact image filename')
          print('Saved Iława photo cache:', out.stat().st_size)
          PY

      - name: Commit mirrored images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'siemiany-site-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/mirror-final-images.yml
          git add assets/img/ilawa-maly-jeziorak-um.jpg \
                  assets/img/szymbark-zamek-1869-duncker.jpg \
                  assets/img/szymbark-zamek-ruiny.jpg
          git commit -m 'Mirror Iława and Szymbark images locally'
          git push origin HEAD:fix/szymbark-ilawa-images
