name: Fix bathroom gallery

on:
  push:
    branches: [new-photos]
    paths:
      - .github/workflows/fix-bathroom-gallery.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-photos
          fetch-depth: 0
      - name: Keep old bathroom photo and add new one to gallery
        run: |
          set -euo pipefail
          git fetch origin master

          # Zachowaj nowe, zoptymalizowane zdjęcie pod nową nazwą.
          cp assets/img/domek-lazienka.webp assets/img/domek-lazienka-nowa.webp
          cp assets/img/r/domek-lazienka-480.webp assets/img/r/domek-lazienka-nowa-480.webp
          cp assets/img/r/domek-lazienka-800.webp assets/img/r/domek-lazienka-nowa-800.webp

          # Przywróć dotychczasowe zdjęcie i jego warianty dokładnie z mastera.
          git checkout origin/master -- assets/img/domek-lazienka.webp assets/img/r/domek-lazienka-800.webp assets/img/r/domek-lazienka-1200.webp
          rm -f assets/img/r/domek-lazienka-480.webp

          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          path = Path('domek.html')
          text = path.read_text(encoding='utf-8')
          master = subprocess.check_output(['git', 'show', 'origin/master:domek.html'], text=True)

          image_pattern = r'<img[^>]*src="assets/img/domek-lazienka\.webp"[^>]*/>'
          master_images = re.findall(image_pattern, master)
          if not master_images:
              raise RuntimeError('Nie znaleziono zdjęcia łazienki w masterze')

          # Pierwsze wystąpienie to zdjęcie w sekcji „Po remoncie w 2025”.
          text, replaced = re.subn(image_pattern, master_images[0], text, count=1)
          if replaced != 1:
              raise RuntimeError('Nie udało się przywrócić starego zdjęcia w sekcji')

          new_gallery_item = (
              '<a class="gallery-half" data-lightbox="" href="assets/img/domek-lazienka-nowa.webp">'
              '<img alt="Jasna łazienka po remoncie - drugie ujęcie" decoding="async" height="1448" loading="lazy" '
              'sizes="(max-width: 760px) 100vw, 50vw" src="assets/img/domek-lazienka-nowa.webp" '
              'srcset="assets/img/r/domek-lazienka-nowa-480.webp 480w, assets/img/r/domek-lazienka-nowa-800.webp 800w, assets/img/domek-lazienka-nowa.webp 1086w" '
              'width="1086"/></a>'
          )

          if 'href="assets/img/domek-lazienka-nowa.webp"' not in text:
              old_gallery_pattern = (
                  r'(<a class="gallery-half" data-lightbox="" href="assets/img/domek-lazienka\.webp">.*?</a>)'
              )
              text, inserted = re.subn(
                  old_gallery_pattern,
                  lambda m: m.group(1) + '\n' + new_gallery_item,
                  text,
                  count=1,
                  flags=re.S,
              )
              if inserted != 1:
                  raise RuntimeError('Nie udało się dodać nowego zdjęcia obok starego w galerii')

          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Zachowaj stare zdjęcie łazienki i dodaj nowe do galerii"
          git push origin HEAD:new-photos
