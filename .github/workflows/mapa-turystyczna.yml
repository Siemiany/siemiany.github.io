name: Add tourist map links

on:
  push:
    branches:
      - mapa-turystyczna
    paths:
      - .github/workflows/mapa-turystyczna.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mapa-turystyczna
      - name: Add map links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          map_href = 'Mapa_turystyczna_N-ctwa_Susz.pdf'

          lasy = Path('lasy-trasy.html')
          text = lasy.read_text(encoding='utf-8')
          old_nav = '<aside class="article-nav"><a href="#krotko">Na godzinę</a><a href="#solniki">Solniki</a>'
          new_nav = '<aside class="article-nav"><a href="#krotko">Na godzinę</a><a href="#mapa-turystyczna">Mapa turystyczna</a><a href="#solniki">Solniki</a>'
          if old_nav not in text:
              raise SystemExit('Nie znaleziono miejsca w nawigacji lasy-trasy.html')
          text = text.replace(old_nav, new_nav, 1)

          marker = '<p>Najlepsze krótkie wyjścia nie wymagają planowania. Jeśli masz więcej czasu, warto połączyć je z Urowcem, Jasnym albo fragmentem trasy Solniki.</p></section>\n<section id="solniki">'
          section = '<p>Najlepsze krótkie wyjścia nie wymagają planowania. Jeśli masz więcej czasu, warto połączyć je z Urowcem, Jasnym albo fragmentem trasy Solniki.</p></section>\n<section id="mapa-turystyczna"><p class="kicker">Do planowania własnych tras</p><h2>Mapa turystyczna Nadleśnictwa Susz</h2><p>Jeśli chcesz samodzielnie układać spacery i wycieczki po Lasach Iławskich, przydaje się szczegółowa mapa turystyczna Nadleśnictwa Susz. To wygodny punkt odniesienia do planowania leśnych wariantów wokół Siemian i dalszych wyjść w teren.</p><a class="place-link" href="' + map_href + '" rel="noopener" target="_blank"><strong>Otwórz mapę turystyczną PDF ↗</strong><span>Mapa Nadleśnictwa Susz · PDF · około 22 MB</span></a></section>\n<section id="solniki">'
          if marker not in text:
              raise SystemExit('Nie znaleziono miejsca na sekcję mapy w lasy-trasy.html')
          text = text.replace(marker, section, 1)
          lasy.write_text(text, encoding='utf-8')

          rowerem = Path('rowerem.html')
          text = rowerem.read_text(encoding='utf-8')
          marker = '<p class="source-note">Przed wyjazdem warto porównać ślad z aktualną mapą - przebieg dróg leśnych, remonty i ograniczenia mogą się zmieniać.</p></section>'
          replacement = '<p class="source-note">Przed wyjazdem warto porównać ślad z aktualną mapą - przebieg dróg leśnych, remonty i ograniczenia mogą się zmieniać.</p><p class="source-note"><strong>Przyda się też:</strong> <a href="' + map_href + '" rel="noopener" target="_blank">mapa turystyczna Nadleśnictwa Susz (PDF, około 22 MB) ↗</a> - szczególnie jeśli chcesz układać własne warianty przez Lasy Iławskie.</p></section>'
          if marker not in text:
              raise SystemExit('Nie znaleziono sekcji GPX w rowerem.html')
          text = text.replace(marker, replacement, 1)
          rowerem.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm .github/workflows/mapa-turystyczna.yml
          git config user.name "Siemiany"
          git config user.email "50377048+Siemiany@users.noreply.github.com"
          git add lasy-trasy.html rowerem.html .github/workflows/mapa-turystyczna.yml
          git commit -m "Add Nadleśnictwo Susz tourist map links"
          git push origin HEAD:mapa-turystyczna
